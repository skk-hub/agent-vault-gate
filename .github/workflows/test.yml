name: gate tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [pwsh, powershell]
    steps:
      - uses: actions/checkout@v4
      - name: Run the gate tests under ${{ matrix.runtime }}
        shell: pwsh
        run: ./test.ps1 -Runtime '${{ matrix.runtime }}'
  linux:
    # The hook is a sh script and the quote/newline filename scenarios only run here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the gate tests under pwsh
        shell: pwsh
        run: ./test.ps1
